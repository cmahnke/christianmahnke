{{- $person := hugo.Data.person -}}

{{- $aboutPage := dict
  "@context" "https://schema.org"
  "@type" "AboutPage"
  "mainEntity" $person
  "publisher" (dict
    "@type" "Person"
    "name" (index $person "name")
    "@id" (index $person "@id")
  )
  "copyrightYear" (now.Year)
-}}

<script type="application/ld+json">
  {{ jsonify $aboutPage | safeJS }}
</script>
