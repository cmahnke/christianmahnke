<header class="header header-main" id="head" data-sticky-class="sticky-top">
    <div class="wrapper">
        <label class="menu-open" for="menu-toggle">
            <i class="menu-open-icon"></i>
        </label>
        <div class="menu">
            {{ partial "menu.html" . }}
        </div>
        <div class="home-link">
            <a href="/" aria-label="{{ $.Site.Title }}"><h1 class="header-title" aria-hidden="true">{{ $.Site.Title }}</h1></a>
        </div>

        {{- $subtitle := .Params.subtitle | default "" -}}
        {{- if ne $subtitle "" -}}
              <h2 class="header-subtitle">{{ $subtitle }}</h2>
        {{- end -}}
    </div>
    <div class="header-spacer"></div>
    <a href="#top" aria-label="{{ i18n "backToTop" }}">
        <div class="backToTop" aria-hidden="true"></div>
    </a>
</header>
