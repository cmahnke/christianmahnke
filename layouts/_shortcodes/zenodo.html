{{- $doi := "" -}}

{{- with .Get "doi" -}}
    {{- $doi = . -}}
{{- end -}}
{{- with $doi -}}
  {{- if partialCached "doi-published.html" . -}}
    <div class="zenodo-badge">
      <a href="https://doi.org/{{ . }}" target="_blank">
        <img src="https://zenodo.org/badge/DOI/{{ . }}.svg" alt="DOI">
      </a>
    </div>
  {{- end -}}
{{- end -}}
