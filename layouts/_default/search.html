{{ define "title" -}}
  {{- if ne .Title "" -}}
    {{- .Title }} · {{ .Site.Title -}}
  {{- else -}}
    {{- .Site.Title -}}
  {{- end -}}
{{- end }}
{{ define "content" }}
  {{- partial "header.html" . -}}
  <div class="content-container single search" id="main-content">
    <div class="post search">
      <div class="search-box-container">
        <input id="search-box" class="search-input" type="text" name="search-bar" value="" aria-label="{{ i18n "Search" }}">
        <button id="search-button" class="search-button" type="button" name="search-button" aria-label="{{ i18n "Search" }}"><i class="search-icon" aria-hidden="true"></i>{{ i18n "Search" }}</button>
      </div>
      <div class="content">
        <div class="search-filter" id="search-filter" aria-live="polite"></div>
        <div id="search-results" class="search-result-container" aria-live="polite"></div>
      </div>
    </div>
  </div>
{{ end }}
