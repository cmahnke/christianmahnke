name: Deploy Artifact to gh-pages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0
          path: docs

      - name: Checkout projektemacher-base repository
        uses: actions/checkout@v7
        with:
          repository: cmahnke/projektemacher-base
          ref: main
          path: themes/projektemacher-base

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pagefind-indexer @ git+https://github.com/cmahnke/pagefind-indexer@0.0.3'

      - name: Run post build scripts
        run: |
          ./scripts/post-build/index.sh

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/index

          MSG="Deploy index to docs/index"

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "ℹ️  No changes detected — skipping commit."
          else
            git commit -m "$MSG"
            git push origin gh-pages
            echo "✅ Changes pushed to gh-pages."
          fi
