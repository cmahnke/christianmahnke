name: Generate and publish article PDFs

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-pdf-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.170.0
  DEPENDENCY_MANAGER: npm
  PYTHON_VERSION: "3.13"

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0
          path: docs

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Install Node dependencies and Chrome
        run: |
          ./themes/projektemacher-base/scripts/init/package.json.sh

      - name: Install Dart SASS
        run: |
          ./themes/projektemacher-base/scripts/github/dart-sass.sh

      - name: Install Hugo
        run: |
          ./themes/projektemacher-base/scripts/github/setup-hugo.sh ${{ env.HUGO_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tqdm

      - name: Setup Java for veraPDF
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install veraPDF CLI
        run: |
          curl -L --fail -o "$RUNNER_TEMP/verapdf-installer.zip" \
            https://software.verapdf.org/releases/verapdf-installer.zip
          unzip -q "$RUNNER_TEMP/verapdf-installer.zip" -d "$RUNNER_TEMP/verapdf-installer"
          cat > "$RUNNER_TEMP/auto-install.xml" <<'EOF'
          <AutomatedInstallation langpack="eng">
              <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
              <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
                  <installpath>${{ runner.temp }}/verapdf</installpath>
              </com.izforge.izpack.panels.target.TargetPanel>
              <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
                  <pack index="0" name="veraPDF GUI" selected="false"/>
                  <pack index="1" name="veraPDF CLI" selected="true"/>
                  <pack index="2" name="veraPDF Documentation" selected="false"/>
                  <pack index="3" name="veraPDF Sample Plugins" selected="false"/>
              </com.izforge.izpack.panels.packs.PacksPanel>
              <com.izforge.izpack.panels.install.InstallPanel id="install"/>
              <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          "$RUNNER_TEMP"/verapdf-installer/verapdf-*/verapdf-install "$RUNNER_TEMP/auto-install.xml"
          "$RUNNER_TEMP/verapdf/verapdf" --version
          echo "$RUNNER_TEMP/verapdf" >> "$GITHUB_PATH"
        shell: bash

      - name: Generate article PDFs
        run: |
          python scripts/article_pdfs.py --force --verapdf

      - name: Commit and push PDFs to gh-pages
        run: |
          cd docs

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          find . -type f -name "article.pdf" -print -exec git add {} \;

          MSG="Deploy article PDFs to docs/post/"

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "ℹ️  No changes detected — skipping commit."
          else
            git commit -m "$MSG"
            git pull --rebase origin gh-pages
            git push origin gh-pages
            echo "✅ PDFs pushed to gh-pages."
          fi
